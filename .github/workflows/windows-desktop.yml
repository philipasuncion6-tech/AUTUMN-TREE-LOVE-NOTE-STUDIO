name: Build Windows 11 Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-11-desktop-installer
    paths:
      - "desktop/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "manifest.json"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated desktop branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows 11 installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Autumn-Tree-Love-Note-Studio-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
