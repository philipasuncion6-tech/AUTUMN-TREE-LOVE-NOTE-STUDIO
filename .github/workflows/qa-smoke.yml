name: Autumn Studio QA Smoke Tests
on:
  push:
    branches:
      - "qa/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run baseline QA tests
        run: npm test
