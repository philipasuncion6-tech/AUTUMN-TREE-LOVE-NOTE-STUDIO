<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520">
<defs>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fff0f4"/><stop offset=".45" stop-color="#ef9caf"/>
  <stop offset="1" stop-color="#b94d72"/>
 </linearGradient>
 <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#ffdce5"/><stop offset=".5" stop-color="#e97896"/>
  <stop offset="1" stop-color="#a93662"/>
 </linearGradient>
 <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fffdf0"/><stop offset=".55" stop-color="#f6d9bd"/>
  <stop offset="1" stop-color="#d99a91"/>
 </linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#b7d88b"/><stop offset=".45" stop-color="#548b51"/>
  <stop offset="1" stop-color="#244e3b"/>
 </linearGradient>
 <radialGradient id="dew">
  <stop stop-color="#fff" stop-opacity=".98"/>
  <stop offset=".5" stop-color="#dff8ff" stop-opacity=".8"/>
  <stop offset="1" stop-color="#9bcbd5" stop-opacity=".35"/>
 </radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<ellipse cx="380" cy="475" rx="235" ry="18" fill="#76556b" opacity=".15" filter="url(#shadow)"/>

<!-- stems -->
<g fill="none" stroke="#47734b" stroke-width="9" stroke-linecap="round">
