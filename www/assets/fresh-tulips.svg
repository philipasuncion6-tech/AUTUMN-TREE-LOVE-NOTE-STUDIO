 <path d="M-43 10 Q-52 -30 -26 -54 Q-12 -31 0 -53 Q18 -72 29 -43 Q49 -18 40 10 Q20 33 0 24 Q-25 35 -43 10Z" fill="url(#rose)" stroke="#bd5577" stroke-width="2"/>
 <path d="M-25 -44 Q-20 -4 -3 22 Q-22 2 -34 -12Z" fill="#fff2f5" opacity=".8"/>
 <path d="M0 -53 Q7 -8 5 23 Q-7 -5 -8 -30Z" fill="#fff" opacity=".6"/>
